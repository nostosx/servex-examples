name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash
    working-directory: .
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - run: task check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.15.0
          install-only: true
      - run: task lint

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install scanner outside the module
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: task vulncheck

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: task api

  integration:
    name: Composed application (owned backends)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVEX_EXAMPLES_IT_POSTGRES_DSN: host=127.0.0.1 port=5432 user=servex password=servex dbname=servex_it sslmode=disable
      SERVEX_EXAMPLES_IT_INDEX_POSTGRES_DSN: postgres://postgres@127.0.0.1:55432/servex_index?sslmode=disable
      SERVEX_EXAMPLES_IT_REDIS_ADDR: 127.0.0.1:6379
      SERVEX_EXAMPLES_IT_S3_ENDPOINT: http://127.0.0.1:9000
      SERVEX_EXAMPLES_IT_S3_BUCKET: servex-composition-it
      SERVEX_EXAMPLES_IT_S3_ACCESS_KEY: servex-example
      SERVEX_EXAMPLES_IT_S3_SECRET_KEY: example-fixture-password
      SERVEX_EXAMPLES_IT_ETCD_ENDPOINTS: 127.0.0.1:2379
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Start isolated integration services
        run: |
          docker run -d --name servex-example-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=servex -e POSTGRES_PASSWORD=servex -e POSTGRES_DB=servex_it \
            postgres:17.11-alpine3.24
          docker run -d --name servex-example-redis -p 127.0.0.1:6379:6379 redis:8.2.10-alpine
          docker run -d --name servex-example-s3 -p 127.0.0.1:9000:9000 \
            -e RUSTFS_ACCESS_KEY="$SERVEX_EXAMPLES_IT_S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$SERVEX_EXAMPLES_IT_S3_SECRET_KEY" \
            rustfs/rustfs:1.0.3 /data
          docker run -d --name servex-example-etcd -p 127.0.0.1:2379:2379 \
            quay.io/coreos/etcd:v3.7.2 /usr/local/bin/etcd --name default \
            --data-dir /tmp/servex-example-etcd --listen-client-urls http://0.0.0.0:2379 \
            --advertise-client-urls http://127.0.0.1:2379
          ready=0
          for ((attempt = 1; attempt <= 90; attempt++)); do
            if docker exec servex-example-postgres pg_isready -U servex -d servex_it >/dev/null 2>&1 \
              && docker exec servex-example-redis redis-cli ping | grep -qx PONG \
              && curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1 \
              && docker exec servex-example-etcd etcdctl endpoint health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Start owned transactional index database
        run: |
          docker run -d --name servex-example-index-postgres -p 127.0.0.1:55432:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=servex_index \
            pgvector/pgvector:0.8.7-pg17
          curl --retry 3 -fsSL https://raw.githubusercontent.com/pgmq/pgmq/v1.13.1/pgmq-extension/pgmq.control -o "$RUNNER_TEMP/pgmq.control"
          curl --retry 3 -fsSL https://raw.githubusercontent.com/pgmq/pgmq/v1.13.1/pgmq-extension/sql/pgmq.sql -o "$RUNNER_TEMP/pgmq--1.13.1.sql"
          docker cp "$RUNNER_TEMP/pgmq.control" servex-example-index-postgres:/usr/share/postgresql/17/extension/pgmq.control
          docker cp "$RUNNER_TEMP/pgmq--1.13.1.sql" servex-example-index-postgres:/usr/share/postgresql/17/extension/pgmq--1.13.1.sql
          ready=0
          for _ in {1..60}; do
            if docker exec servex-example-index-postgres psql -h 127.0.0.1 -U postgres -d servex_index -c 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec servex-example-index-postgres psql -U postgres -d servex_index -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector; CREATE EXTENSION pgmq'
      - name: Verify application composition without skipped tests
        run: task test INTEGRATION=true
      - name: Run the transactional indexing command
        env:
          SERVEX_DEMO_POSTGRES_DSN: postgres://postgres@127.0.0.1:55432/servex_index?sslmode=disable
          SERVEX_DEMO_POSTGRES_SCHEMA: sx_demo_ci
        run: |
          output=$(go run ./cmd/postgres-demo)
          test "$output" = '{"vector_hits":1,"text_hits":1}'
      - name: Remove owned integration services
        if: always()
        run: |
          for container in servex-example-index-postgres servex-example-postgres servex-example-redis servex-example-s3 servex-example-etcd; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              docker rm -f -v "$container"
            fi
          done
