name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash
    working-directory: .
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: nostosx/servex-contrib
          path: .sources/servex-contrib
      - run: bash .github/scripts/check-source.sh check
        env:
          SERVEX_CONTRIB_SOURCE: ${{ github.workspace }}/.sources/servex-contrib

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.15.0
          install-only: true
      - uses: actions/checkout@v7
        with:
          repository: nostosx/servex-contrib
          path: .sources/servex-contrib
      - run: bash .github/scripts/check-source.sh lint
        env:
          SERVEX_CONTRIB_SOURCE: ${{ github.workspace }}/.sources/servex-contrib

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install scanner outside the module
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - uses: actions/checkout@v7
        with:
          repository: nostosx/servex-contrib
          path: .sources/servex-contrib
      - run: bash .github/scripts/check-source.sh vulncheck
        env:
          SERVEX_CONTRIB_SOURCE: ${{ github.workspace }}/.sources/servex-contrib

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - run: task api

  integration:
    name: Composed application (owned backends)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVEX_EXAMPLES_IT_POSTGRES_DSN: host=127.0.0.1 port=5432 user=servex password=servex dbname=servex_it sslmode=disable
      SERVEX_EXAMPLES_IT_REDIS_ADDR: 127.0.0.1:6379
      SERVEX_EXAMPLES_IT_S3_ENDPOINT: http://127.0.0.1:9000
      SERVEX_EXAMPLES_IT_S3_BUCKET: servex-composition-it
      SERVEX_EXAMPLES_IT_S3_ACCESS_KEY: servex-example
      SERVEX_EXAMPLES_IT_S3_SECRET_KEY: example-fixture-password
      SERVEX_EXAMPLES_IT_ETCD_ENDPOINTS: 127.0.0.1:2379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nostosx/servex-contrib
          path: .sources/servex-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Start isolated integration services
        run: |
          docker run -d --name servex-example-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=servex -e POSTGRES_PASSWORD=servex -e POSTGRES_DB=servex_it \
            postgres:17.11-alpine3.24
          docker run -d --name servex-example-redis -p 127.0.0.1:6379:6379 redis:8.2.10-alpine
          docker run -d --name servex-example-s3 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$SERVEX_EXAMPLES_IT_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$SERVEX_EXAMPLES_IT_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-01-20T14-49-07Z server /data
          docker run -d --name servex-example-etcd -p 127.0.0.1:2379:2379 \
            quay.io/coreos/etcd:v3.7.2 /usr/local/bin/etcd --name default \
            --data-dir /tmp/servex-example-etcd --listen-client-urls http://0.0.0.0:2379 \
            --advertise-client-urls http://127.0.0.1:2379
          ready=0
          for ((attempt = 1; attempt <= 90; attempt++)); do
            if docker exec servex-example-postgres pg_isready -U servex -d servex_it >/dev/null 2>&1 \
              && docker exec servex-example-redis redis-cli ping | grep -qx PONG \
              && curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1 \
              && docker exec servex-example-etcd etcdctl endpoint health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
      - name: Verify application composition without skipped tests
        run: bash .github/scripts/check-source.sh test INTEGRATION=true
        env:
          SERVEX_CONTRIB_SOURCE: ${{ github.workspace }}/.sources/servex-contrib
      - name: Remove owned integration services
        if: always()
        run: |
          for container in servex-example-postgres servex-example-redis servex-example-s3 servex-example-etcd; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              docker rm -f -v "$container"
            fi
          done
